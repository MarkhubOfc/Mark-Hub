<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Editor Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #30363d;
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header h1::before {
            content: "◈";
            color: #58a6ff;
        }

        .user-info {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #30363d;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #58a6ff;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .repo-section {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .repo-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .repo-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }

        .repo-item:hover {
            background: #21262d;
        }

        .repo-item.active {
            background: #1f6feb;
            color: #fff;
        }

        .repo-item::before {
            content: "📁";
            font-size: 12px;
        }

        /* File Tree */
        .file-tree {
            margin-top: 16px;
        }

        .tree-item {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 4px;
            transition: all 0.15s;
            user-select: none;
        }

        .tree-item:hover {
            background: #21262d;
        }

        .tree-item.selected {
            background: #388bfd33;
            color: #58a6ff;
        }

        .tree-item.file::before {
            content: "📄";
        }

        .tree-item.folder::before {
            content: "📂";
        }

        .tree-item.folder.collapsed::before {
            content: "📁";
        }

        .tree-children {
            padding-left: 16px;
            display: none;
        }

        .tree-children.expanded {
            display: block;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            height: 48px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .breadcrumb {
            flex: 1;
            font-size: 13px;
            color: #8b949e;
        }

        .breadcrumb span {
            color: #c9d1d9;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        .btn-primary {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .btn-danger {
            background: #da3633;
            border-color: #da3633;
            color: #fff;
        }

        .btn-danger:hover {
            background: #f85149;
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-tabs {
            height: 36px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
        }

        .tab {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
            border-bottom: none;
        }

        .tab.active {
            background: #161b22;
            border-color: #30363d;
            color: #f0f6fc;
        }

        .tab-close {
            opacity: 0.5;
            cursor: pointer;
        }

        .tab-close:hover {
            opacity: 1;
            color: #f85149;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .code-editor {
            width: 100%;
            height: 100%;
            background: #0d1117;
            color: #c9d1d9;
            border: none;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 2;
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            width: 48px;
            height: 100%;
            background: #0d1117;
            border-right: 1px solid #30363d;
            padding: 16px 8px;
            text-align: right;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #484f58;
            user-select: none;
            overflow: hidden;
        }

        .code-editor {
            padding-left: 64px;
        }

        /* Rename Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 480px;
            max-width: 90vw;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #f0f6fc;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .login-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #f0f6fc;
        }

        .login-card p {
            color: #8b949e;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .github-btn {
            width: 100%;
            padding: 12px;
            background: #238636;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .github-btn:hover {
            background: #2ea043;
            transform: translateY(-1px);
        }

        .token-input {
            width: 100%;
            margin-top: 16px;
        }

        .token-input input {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 13px;
        }

        .token-input button {
            margin-top: 8px;
            width: 100%;
            padding: 10px;
            background: #1f6feb;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        /* Status Bar */
        .status-bar {
            height: 28px;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            color: #8b949e;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
        }

        .status-dot.syncing {
            background: #d29922;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 4px;
            min-width: 180px;
            z-index: 500;
            display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .context-menu.active {
            display: block;
        }

        .context-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-item:hover {
            background: #21262d;
        }

        .context-item.danger {
            color: #f85149;
        }

        .context-divider {
            height: 1px;
            background: #30363d;
            margin: 4px 0;
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #484f58;
            gap: 16px;
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 320px;
            word-break: break-word;
        }

        .toast.success {
            background: #238636;
            color: #fff;
        }

        .toast.error {
            background: #da3633;
            color: #fff;
        }

        .toast.info {
            background: #1f6feb;
            color: #fff;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Diff View */
        .diff-view {
            flex: 1;
            overflow: auto;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .diff-line {
            padding: 2px 8px;
            white-space: pre;
            display: flex;
        }

        .diff-line.add {
            background: #0f3d0f;
            color: #3fb950;
        }

        .diff-line.add::before {
            content: "+ ";
            color: #3fb950;
            min-width: 20px;
        }

        .diff-line.del {
            background: #3d0f0f;
            color: #f85149;
        }

        .diff-line.del::before {
            content: "- ";
            color: #f85149;
            min-width: 20px;
        }

        .diff-line.neutral {
            color: #8b949e;
        }

        .diff-line.neutral::before {
            content: "  ";
            min-width: 20px;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-box {
            padding: 8px 16px;
        }

        .search-box input {
            width: 100%;
            padding: 6px 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 13px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #58a6ff;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h1>◈ Repo Editor Pro</h1>
            <p>Edite seus repositórios GitHub diretamente do navegador.<br>Renomeie, mova e edite arquivos com facilidade.</p>
            <button class="github-btn" onclick="loginWithGitHub()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                Entrar com GitHub
            </button>
            <div class="token-input">
                <input type="password" id="tokenInput" placeholder="Ou cole seu GitHub Token aqui...">
                <button onclick="loginWithToken()">Entrar com Token</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="container" id="appContainer" style="display: none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Repo Editor Pro</h1>
            </div>
            <div class="user-info" id="userInfo" style="display: none;">
                <img class="user-avatar" id="userAvatar" src="" alt="">
                <span class="user-name" id="userName"></span>
            </div>
            <div class="search-box">
                <input type="text" id="repoSearch" placeholder="Buscar repositórios..." oninput="filterRepos()">
            </div>
            <div class="repo-section">
                <div class="section-title">Repositórios</div>
                <div class="repo-list" id="repoList">
                    <div style="padding: 20px; text-align: center; color: #484f58; font-size: 13px;">
                        Faça login para ver seus repositórios
                    </div>
                </div>
                <div class="file-tree" id="fileTree" style="display: none;">
                    <div class="section-title" style="margin-top: 16px;">Arquivos</div>
                    <div id="treeContent"></div>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="toolbar">
                <div class="breadcrumb" id="breadcrumb">Selecione um repositório</div>
                <button class="btn" onclick="refreshCurrent()" id="refreshBtn" style="display: none;">
                    ↻ Atualizar
                </button>
                <button class="btn btn-primary" onclick="commitChanges()" id="commitBtn" style="display: none;">
                    ✓ Commit
                </button>
                <button class="btn btn-danger" onclick="logout()" id="logoutBtn">
                    Sair
                </button>
