<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <title>Mark Hub | Home</title>

    <style>
      body {
        background-color: #191919;
        color: #b2b2b2;
        font-family: Arial, sans-serif;
      }

      .title-box {
        width: 130px;
        height: 25px;
        padding: 20px;
        margin: auto;
        background-color: #2f2f2f;
        border: 2px solid #363636;
        border-radius: 10px;
        transition: 0.2s;
      }
      
      .title-box:hover {
        transform: scale(1.02);
        border-color: #4a4a4a;
      }
      
      .title {
        text-align: center;
      }
      
      .title h1,
      .title h2 {
        font-family: Arial, sans-serif;
      }
    
      .script-page {
        width: auto;
        height: auto;
        padding: 15px 20px;
        margin: 20px auto;
        background-color: #151515;
        border: 2px solid #333333;
        border-radius: 8px;
        color: #d4d4d4;
        line-height: 1.5;
        transition: 0.2s;
      }

      .hub {
        width: auto;
        height: auto;
        padding: 0px 20px;
        margin: 20px auto;
        background-color: #151515;
        border: 2px solid #333333;
        border-radius: 8px;
        color: #d4d4d4;
        line-height: 1;
        transition: 0.2s;
      }

      .open-feature {
        cursor: pointer;
        user-select: none;
        font-weight: bold;
        color: #e0e0e0;
        margin-bottom: 10px;
        display: inline-block;
      }

      .hub-features {
        padding: 0;
        margin: 0 0 10px 0;
        list-style: none;
        display: none;
      }

      .hub-features.show {
        display: block;
      }

      .hub-features li {
        padding: 10px 15px;
        margin-bottom: 8px;
        background-color: #1e1e1e;
        border-left: 3px solid #444444;
        border-radius: 4px;
        transition: 0.2s;
      }

      .hub-features li:hover {
        background-color: #252525;
        border-left-color: #007acc;
      }

      .code-box {
        background-color: #0d0d0d;
        border: 1px solid #333333;
        border-radius: 4px;
        padding: 12px;
        font-family: 'Courier New', Courier, monospace;
        color: #9cdcfe;
        overflow-x: auto;
        white-space: pre;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="title-box">
      <div class="title">
        <h2 style="color: #12e51a; margin-top: -20px;">
          Welcome to
        </h2>
        <h1 style="margin-top: -25px; margin-right: 60px; color: #e5e112;">
          Mark
        </h1>
        <h1 style="margin-top: -59.9px; margin-right: -90px; color: #1279e5;">
          Hub
        </h1>
      </div>
    </div>
    <div class="script-page">
      <div class="hub">
        <h2>Game: Example</h2>
        <div class="open-feature" id="btn-feature">Features</div>
        <div class="hub-features" id="list-feature">
        </div>
        
        <div class="code-box">loadstring(game:HttpGet(""))()</div>
      </div>
      <div class="hub">
        <h2>Game: Example</h2>
        <div class="open-feature" id="btn-feature-2">Features</div>
        <div class="hub-features" id="list-feature-2">
        </div>
        
        <div class="code-box">loadstring(game:HttpGet(""))()</div>
      </div>
    </div>
  </body>
  <script>
    const btnFeature = document.getElementById('btn-feature');
    const listFeature = document.getElementById('list-feature');
    const btnFeature2 = document.getElementById('btn-feature-2');
    const listFeature2 = document.getElementById('list-feature-2');

    btnFeature.addEventListener('click', () => {
      listFeature.classList.toggle('show');
    });
    btnFeature2.addEventListener('click', () => {
      listFeature2.classList.toggle('show')
    });
  </script>
</html>
